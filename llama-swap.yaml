# PhonoScore behind llama-swap: llama-swap --config llama-swap.yaml --port 8080
# Model options: https://github.com/mostlygeek/llama-swap
models:
  qwen3-asr:
    cmd: python asr_server.py --port ${PORT} --model Qwen3-ASR-0.6B
    ttl: 3600
    healthCheckTimeout: 120
    checkEndpoint: /health

  qwen3-asr-1.7b:
    cmd: python asr_server.py --port ${PORT} --model Qwen3-ASR-1.7B
    ttl: 3600
    healthCheckTimeout: 180
    checkEndpoint: /health

  openpronounce:
    cmd: python pronounce_server.py --port ${PORT}
    ttl: 3600
    healthCheckTimeout: 180
    checkEndpoint: /health

# Each request uses both ASR and scoring; keep them loaded together instead of swapping.
groups:
  pipeline:
    swap: false
    members:
      - qwen3-asr
      - qwen3-asr-1.7b
      - openpronounce
